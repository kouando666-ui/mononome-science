<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学習ホーム・問題管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f8;color:#19334a;font:16px -apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}main{max-width:720px;margin:auto;padding:16px}header{background:#123a55;color:white;padding:23px;border-radius:18px}h1{margin:5px 0;font-size:24px}h2{font-size:20px}.panel{background:white;padding:20px;border-radius:17px;margin:15px 0;box-shadow:0 2px 12px #173d5511}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{cursor:pointer;font:inherit}.tile,.btn{border:0;border-radius:12px;padding:14px;width:100%;text-align:left;margin:5px 0}.tile{background:#eaf2f7;color:#183f58;font-weight:bold;min-height:82px}.btn{background:#087b86;color:white;text-align:center;font-weight:bold}.alt{background:#e8f0f4;color:#173e54}.danger{background:#a63d43}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.inline{width:auto;min-height:0;padding:9px 13px}.item{border-bottom:1px solid #e3edf2;padding:12px 0}label{display:block;margin:12px 0;font-weight:600}input,textarea,select{display:block;width:100%;font:inherit;border:1px solid #bccfda;border-radius:10px;padding:12px;margin:6px 0}input[type=radio]{display:inline;width:auto}.muted{font-size:13px;color:#647b8b}.opt{width:100%;background:#fff;padding:15px;border:2px solid #d3e2e8;text-align:left;border-radius:10px;margin:7px 0}.chosen{border-color:#178da1;background:#e4f7fa}.right{color:#147c51}.wrong{color:#b33c3c}.hidden{display:none}.tag{font-size:12px;border-radius:20px;padding:6px 10px;background:#e4f2eb}img.figure{display:block;max-width:100%;max-height:280px;margin:10px auto}a{color:#04748b}#status{font-size:12px}button:focus-visible,input:focus-visible{outline:3px solid orange}</style></head><body><main><header><small>予習シリーズ・家族の学習アプリ</small><h1>📚 学習ホーム・問題管理</h1><div id="status">接続準備中</div></header><div id="view"></div><p class="muted">問題の編集は同じ家族アカウントの全員が利用できます。</p></main><script src="questions.js"></script><script src="firebase-config.js"></script><script type="module">
const subjects={science:"🧪 理科",social:"🌏 社会",kanji:"✏️ 漢字",vocab:"📖 語彙"};
const KEY="mononome-manager-v1",unit0="science-g4-13";
const el=document.getElementById("view"),status=document.getElementById("status");
const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const makeId=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
const base=()=>({units:[{id:unit0,subject:"science",title:"第13回 物の燃え方",grade:"小4",description:"空気と燃焼・炎のつくり",questions:(window.QUESTIONS||[]).map((q,i)=>({id:"original-"+(i+1),text:q[0],options:q[1],answer:q[2],explanation:q[3],memory:q[4],figure:q[5],advanced:!!q[6],source:q[7],wrongReasons:q[8]}))}],progress:{},revision:0});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||base()}catch{state=base()}
if(!Array.isArray(state.units))state=base();
let page="home",subject="science",unitId=unit0,editId=null,draft=null,idx=0,quiz=[],selection=null,answered=false,mode="all",threshold=1,sessionWrong=[];
let au=null,fs=null,uid=null,cloud=false,busy=false;
const current=()=>state.units.find(u=>u.id===unitId);
const prog=()=>state.progress[unitId]||(state.progress[unitId]={attempts:{},mistakes:{},correct:{},position:0,history:[]});
const saveLocal=()=>localStorage.setItem(KEY,JSON.stringify(state));
async function save(){state.revision=Date.now();saveLocal();if(cloud&&uid){try{await fs.setDoc(fs.doc(fs.getFirestore(),"families",uid),{catalogV2:state},{merge:true});status.textContent="☁ 家族アカウント同期中"}catch(e){console.error(e);alert("クラウド保存に失敗しました。端末には保存済みです。")}}}
const button=(s,a,cl="")=>'<button class="btn '+cl+'" data-a="'+a+'">'+escape(s)+'</button>';
const back=(s="home")=>button("← 戻る",s,"alt");
function draw(){let h="",u=current(),p=u?prog():null,Q=u?.questions||[];
if(page==="home"){h='<div class="panel"><h2>科目を選ぶ</h2><div class="grid">'+Object.entries(subjects).map(([key,label])=>'<button class="tile" data-subject="'+key+'">'+label+'<div class="muted">単元一覧へ</div></button>').join("")+'</div></div><div class="panel">'+button("⚙ 問題・単元の管理","manage")+button("☁ ログイン・同期設定","login","alt")+button("従来の物の燃え方アプリへ","legacy","alt")+'</div>'}
else if(page==="units"){h='<div class="panel">'+back()+'<h2>'+escape(subjects[subject])+'</h2>'+state.units.filter(x=>x.subject===subject).map(x=>'<button class="tile" data-unit="'+escape(x.id)+'">'+escape(x.title)+'<div class="muted">'+escape(x.grade)+' ／ '+x.questions.length+'問</div></button>').join("")+button("＋ 新しい単元","newunit","alt")+'</div>'}
else if(page==="unit"){h='<div class="panel">'+back("units")+'<h2>'+escape(u.title)+'</h2><p class="muted">'+escape(u.grade)+'　'+Q.length+'問 ／ 進捗 '+p.position+'問</p>'+button("▶ 一問一答を始める","start")+button("↻ 間違えた問題の復習","review","alt")+button("▥ 学習記録","stats","alt")+button("✎ 問題を編集する","questions","alt")+'</div>'}
else if(page==="questions"){h='<div class="panel">'+back("unit")+'<h2>'+escape(u.title)+'：問題一覧</h2>'+Q.map((q,i)=>'<div class="item"><strong>No.'+(i+1)+'</strong> '+escape(q.text)+'<button class="btn alt inline" data-edit="'+escape(q.id)+'">編集</button></div>').join("")+button("＋ 問題を追加","newquestion")+'</div>'}
else if(page==="manage"){h='<div class="panel">'+back()+'<h2>⚙ 問題管理</h2><div class="grid">'+Object.entries(subjects).map(([key,label])=>'<button class="tile" data-manage="'+key+'">'+label+'</button>').join("")+'</div>'+button("学習データを書き出す","backup","alt")+'<p class="muted">学習履歴の初期化は完成・動作確認後に行います。</p></div>'}
else if(page==="manageunits"){h='<div class="panel">'+back("manage")+'<h2>'+escape(subjects[subject])+' の管理</h2>'+state.units.filter(x=>x.subject===subject).map(x=>'<div class="item"><strong>'+escape(x.title)+'</strong><div class="row"><button class="btn inline alt" data-unit-edit="'+escape(x.id)+'">単元編集</button><button class="btn inline" data-unit-questions="'+escape(x.id)+'">問題一覧</button></div></div>').join("")+button("＋ 単元を追加","newunit")+'</div>'}
else if(page==="editunit"){h='<div class="panel">'+back("manageunits")+'<h2>単元の編集</h2><label>単元名<input id="title" value="'+escape(draft.title)+'"></label><label>学年<input id="grade" value="'+escape(draft.grade)+'"></label><label>内容・説明<textarea id="description">'+escape(draft.description||"")+'</textarea></label>'+button("保存","saveunit")+(editId&&editId!==unit0?button("単元を削除","deleteunit","danger"):"")+'</div>'}
else if(page==="editquestion"){h='<div class="panel">'+back("questions")+'<h2>問題を編集</h2><label>問題文<textarea id="qtext">'+escape(draft.text)+'</textarea></label>'+draft.options.map((v,i)=>'<label>選択肢 '+("ABCD"[i])+'<input id="opt'+i+'" value="'+escape(v)+'"></label>').join("")+'<label>正解<select id="answer">'+draft.options.map((_,i)=>'<option value="'+i+'" '+(i===Number(draft.answer)?"selected":"")+'>選択肢 '+("ABCD"[i])+'</option>').join("")+'</select></label><label>解説<textarea id="explanation">'+escape(draft.explanation)+'</textarea></label><label>覚え方<textarea id="memory">'+escape(draft.memory||"")+'</textarea></label><label>実験図のキー（既存図のみ。例：flame）<input id="figure" value="'+escape(draft.figure||"")+'"></label><label>教材メモ<input id="source" value="'+escape(draft.source||"")+'"></label>'+button("問題を保存","savequestion")+(editId?button("この問題を削除","deletequestion","danger"):"")+'</div>'}
else if(page==="review"){const arr=Q.map((_,i)=>i).filter(i=>(p.mistakes[i]||0)>=threshold);h='<div class="panel">'+back("unit")+'<h2>苦手問題の復習</h2><label>間違えた回数<select id="threshold"><option value="1">1回以上</option><option value="2">2回以上</option><option value="3">3回以上</option></select></label><p>対象：'+arr.length+'問</p>'+button("復習開始","startreview")+'</div>'}
else if(page==="stats"){h='<div class="panel">'+back("unit")+'<h2>学習記録</h2><p>累計回答：'+Object.values(p.attempts).reduce((a,b)=>a+b,0)+'回</p>'+Q.map((q,i)=>'<div class="item">No.'+(i+1)+'　'+escape(q.text)+'<div class="muted">回答 '+(p.attempts[i]||0)+'回 / 間違い '+(p.mistakes[i]||0)+'回</div></div>').join("")+'</div>'}
else if(page==="quiz"){if(idx>=quiz.length){page="finish";return draw()}const n=quiz[idx],q=Q[n];if(!q){page="unit";return draw()}h='<div class="panel">'+back("unit")+'<p class="muted">'+(idx+1)+' / '+quiz.length+'問　No.'+(n+1)+'</p><h2>'+escape(q.text)+'</h2>'+(q.figure&&/^[a-z0-9-]+$/i.test(q.figure)?'<img class="figure" src="assets/quiz-'+q.figure+'.svg" alt="オリジナル実験図">':"")+q.options.map((o,i)=>'<button class="opt '+(selection===i?"chosen":"")+'" data-choice="'+i+'" '+(answered?"disabled":"")+'> '+("ABCD"[i])+'. '+escape(o)+'</button>').join("")+(answered?'<p class="'+(selection===Number(q.answer)?"right":"wrong")+'"><strong>'+(selection===Number(q.answer)?"正解！":"不正解。正解は "+("ABCD"[q.answer]))+'</strong></p><p>'+escape(q.explanation)+'</p><p><strong>覚え方：</strong>'+escape(q.memory||"")+'</p>'+(q.figure&&/^[a-z0-9-]+$/i.test(q.figure)?'<details><summary>解説図</summary><img class="figure" src="assets/'+q.figure+'.webp"></details>':"")+button("次の問題","next"):button("答え合わせ","check"))+'</div>'}
else if(page==="finish"){h='<div class="panel">'+back("unit")+'<h2>🎉 おつかれさま！</h2><p>今回間違えた問題：'+sessionWrong.length+'問</p>'+button("今回間違えた問題だけ復習","sessionreview","alt")+'</div>'}
else if(page==="login"){h='<div class="panel">'+back()+'<h2>☁ 家族アカウント</h2><p class="muted">従来アプリと同じメールアドレス・パスワードです。</p><label>メール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label>'+button("ログイン","signin")+button("ログアウト","signout","alt")+'</div>'}
el.innerHTML=h;el.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));el.querySelectorAll("[data-subject]").forEach(b=>b.onclick=()=>{subject=b.dataset.subject;page="units";draw()});el.querySelectorAll("[data-manage]").forEach(b=>b.onclick=()=>{subject=b.dataset.manage;page="manageunits";draw()});el.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unitId=b.dataset.unit;page="unit";draw()});el.querySelectorAll("[data-unit-questions]").forEach(b=>b.onclick=()=>{unitId=b.dataset.unit;page="questions";draw()});el.querySelectorAll("[data-unit-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.unitEdit;draft={...state.units.find(x=>x.id===editId)};page="editunit";draw()});el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editId=b.dataset.edit;draft=JSON.parse(JSON.stringify(current().questions.find(x=>x.id===editId)));page="editquestion";draw()});el.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(!answered){selection=Number(b.dataset.choice);draw()}});if(document.getElementById("threshold"))document.getElementById("threshold").value=String(threshold),document.getElementById("threshold").onchange=e=>{threshold=Number(e.target.value);draw()}}
function begin(arr,kind){if(!arr.length)return alert("対象の問題がありません");quiz=arr;idx=0;mode=kind;selection=null;answered=false;sessionWrong=[];page="quiz";draw()}
async function act(a){const u=current(),Q=u?.questions||[],p=u?prog():null;
if(a==="legacy"){location.href="index.html";return}
if(["home","units","unit","questions","manage","manageunits","review","stats","login"].includes(a))page=a;
else if(a==="newunit"){editId=null;draft={subject,title:"",grade:"小4",description:""};page="editunit"}
else if(a==="saveunit"){let title=document.getElementById("title").value.trim();if(!title)return alert("単元名を入力してください");if(editId){let x=state.units.find(x=>x.id===editId);x.title=title;x.grade=document.getElementById("grade").value;x.description=document.getElementById("description").value}else{unitId=makeId();state.units.push({id:unitId,subject,title,grade:document.getElementById("grade").value,description:document.getElementById("description").value,questions:[]})}await save();page="manageunits"}
else if(a==="deleteunit"){if(!confirm("単元と問題・学習記録を削除しますか？"))return;state.units=state.units.filter(x=>x.id!==editId);delete state.progress[editId];await save();page="manageunits"}
else if(a==="newquestion"){editId=null;draft={id:makeId(),text:"",options:["","","",""],answer:0,explanation:"",memory:"",figure:"",source:""};page="editquestion"}
else if(a==="savequestion"){const text=document.getElementById("qtext").value.trim(),options=[0,1,2,3].map(i=>document.getElementById("opt"+i).value.trim());if(!text||options.some(x=>!x))return alert("問題文と選択肢4つを入力してください");const figure=document.getElementById("figure").value.trim();if(figure&&!/^[a-z0-9-]+$/i.test(figure))return alert("図キーは半角英数字とハイフンのみです");let q={...draft,text,options,answer:Number(document.getElementById("answer").value),explanation:document.getElementById("explanation").value,memory:document.getElementById("memory").value,figure,source:document.getElementById("source").value};if(editId){let i=Q.findIndex(x=>x.id===editId);Q[i]=q}else Q.push(q);await save();page="questions"}
else if(a==="deletequestion"){let n=Q.findIndex(x=>x.id===editId);if(n<0||!confirm("問題を削除しますか？学習記録の番号も調整します。"))return;Q.splice(n,1);for(const k of ["attempts","mistakes","correct"]){let next={};for(const [i,v] of Object.entries(p[k]||{})){if(Number(i)<n)next[i]=v;else if(Number(i)>n)next[Number(i)-1]=v}p[k]=next}p.history=(p.history||[]).filter(h=>h.n!==n).map(h=>({...h,n:h.n>n?h.n-1:h.n}));p.position=Math.max(0,p.position>n?p.position-1:p.position);await save();page="questions"}
else if(a==="start"){if(p.position>=Q.length){if(!confirm("初めから出題しますか？累計記録は残ります。"))return;p.position=0;await save()}begin(Q.map((_,i)=>i).slice(p.position),"all");return}
else if(a==="startreview"){begin(Q.map((_,i)=>i).filter(i=>(p.mistakes[i]||0)>=threshold),"review");return}
else if(a==="check"){if(selection===null)return alert("選択肢を選んでください");if(answered)return;answered=true;let n=quiz[idx],ok=selection===Number(Q[n].answer);p.attempts[n]=(p.attempts[n]||0)+1;if(ok)p.correct[n]=(p.correct[n]||0)+1;else{p.mistakes[n]=(p.mistakes[n]||0)+1;sessionWrong.push(n)}p.history.push({n,questionId:Q[n].id,choice:selection,ok,date:new Date().toISOString()});if(mode==="all")p.position=Math.max(p.position,n+1);await save()}
else if(a==="next"){idx++;selection=null;answered=false;page=idx>=quiz.length?"finish":"quiz"}
else if(a==="sessionreview"){begin([...new Set(sessionWrong)],"review");return}
else if(a==="backup"){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="学習アプリ_バックアップ.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
else if(a==="signin"||a==="signout"){if(!cloud)return alert("Firebaseが利用できません");try{if(a==="signout")await au.signOut(au.getAuth());else await au.signInWithEmailAndPassword(au.getAuth(),document.getElementById("email").value,document.getElementById("password").value)}catch(e){alert("認証エラー："+e.message)}return}
draw()}
async function initialize(){if(!window.FIREBASE_CONFIG){status.textContent="この端末に保存中";draw();return}try{const app=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),auth=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),fire=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");app.initializeApp(window.FIREBASE_CONFIG);au=auth;fs=fire;cloud=true;auth.onAuthStateChanged(auth.getAuth(),async u=>{uid=u?.uid||null;if(u){try{const snap=await fire.getDoc(fire.doc(fire.getFirestore(),"families",uid));const remote=snap.data()?.catalogV2;if(remote&&Array.isArray(remote.units)&&Number(remote.revision||0)>Number(state.revision||0)){state=remote;saveLocal()}else await save();status.textContent="☁ 家族同期："+u.email}catch(e){console.error(e);status.textContent="⚠ 同期できませんでした"}}else status.textContent="Firebase利用可能・未ログイン";draw()})}catch(e){console.error(e);status.textContent="この端末に保存中"}draw()}initialize();
</script></body></html>
